<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuahSafe | Sortasi Mutu Jambu Kristal</title>
    <meta name="theme-color" content="#1e6b3c" />
    <script>
      // Terapkan mode gelap sebelum halaman tergambar (tanpa kedip terang)
      try {
        var t = localStorage.getItem("buahsafe.theme");
        // Bawaan terang: meja sortasi berada di tempat terang. Gelap hanya bila dipilih pengguna.
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <meta name="description" content="Sortasi mutu jambu kristal tanpa merusak buah dengan spektroskopi optik Visible-NIR (AS7265x)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
